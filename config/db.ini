# Configuracion de Base de Datos - Aerolinea
# ========================================
# Puedes editar estos valores segun tu entorno
# Las variables de entorno del sistema tienen prioridad sobre estos valores

# Host del servidor MySQL
# Valores comunes: 127.0.0.1, localhost, servidor.ejemplo.com
MYSQL_HOST=127.0.0.1

# Puerto del servidor MySQL
# Valor por defecto de MySQL: 3306
MYSQL_PORT=3306

# Usuario de MySQL
# En XAMPP por defecto es "root"
MYSQL_USER=root

# Contrasena de MySQL
# En XAMPP por defecto esta vacia
# Si configuras aqui, reemplaza la variable de entorno MYSQL_PASSWORD
MYSQL_PASSWORD=

# Nombre de la base de datos
# Nombre por defecto: aerolinea
MYSQL_DATABASE=aerolinea

# Charset para conexion (recomendado: utf8mb4)
MYSQL_CHARSET=utf8mb4
